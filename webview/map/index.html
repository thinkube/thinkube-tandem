<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tandem</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      /* A control the phase does not allow is visibly off, and a press on
         it does nothing — the hover text says why. */
      button:disabled { opacity: 0.35; cursor: not-allowed; }
      /* A pan that reaches the document edge must end here: overscroll
         chaining past this frame is what the browser reads as "go back". */
      html, body { overscroll-behavior: none; }
      body { font-family: var(--vscode-font-family, sans-serif); color: var(--vscode-foreground); background: var(--vscode-editor-background); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
